<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macbeth: Trivia</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        .trivia-body {
            background-color: #1a1512;
            color: #f4ede0;
            font-family: 'Cinzel', 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
            text-align: center;
        }
        .trivia-card {
            background-color: #2b1f18;
            border: 3px solid #d4af37;
            border-radius: 8px;
            padding: 2.5rem 1.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }
        .trivia-card h1 {
            color: #d4af37;
            font-family: 'MedievalSharp', cursive;
            margin-top: 0;
            font-size: 2rem;
            letter-spacing: 1.5px;
        }
        .trivia-card p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #ede4c9;
        }
        .scroll-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="trivia-body">
    <div class="trivia-card">
        <span class="scroll-icon">📜</span>
        <h1>Macbeth Trivia</h1>
        <p>The royal scrolls are being prepared. This trivia game, full of questions about the ambition of Macbeth and the prophecies of the witches, will be unlocked soon.</p>
        <a href="index.html" class="btn">Return to Kingdom</a>
    </div>
</body>
</html>
