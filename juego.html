<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>The Tragedy of Macbeth — Interactive Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== GAME SHELL LAYOUT ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background: #0b0806;
            overflow: hidden;
            font-family: 'Cinzel', serif;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
        }

        /* HUD */
        #hud {
            flex: 0 0 auto;
            background: linear-gradient(180deg, #1a0f0a 0%, #231812 100%);
            border-bottom: 2px solid #8b5a2b;
            padding: 0.35rem 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            z-index: 10;
        }

        #actIndicator {
            font-family: 'MedievalSharp', cursive;
            font-size: 0.7rem;
            color: #8b5a2b;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        #actTitle {
            font-size: 0.85rem;
            color: #d4af37;
            font-weight: 700;
            text-align: center;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #scoreDisplay {
            font-size: 0.8rem;
            color: #ede4c9;
            white-space: nowrap;
        }

        #hpBar {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }

        #hpLabel { font-size: 0.7rem; color: #ff4d4d; }

        #hpBarInner {
            width: 60px; height: 8px;
            background: #3a1010;
            border-radius: 4px;
            border: 1px solid #8b1e1e;
            overflow: hidden;
        }

        #hpBarFill {
            height: 100%;
            background: linear-gradient(90deg, #ff1a1a, #e74c3c);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* CANVAS WRAPPER */
        #canvasWrapper {
            flex: 1 1 0;
            position: relative;
            overflow: hidden;
            background: #0b0806;
            min-height: 0;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* OVERLAY SCREENS */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 8, 6, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
            z-index: 100;
        }

        .overlay.hidden { display: none; }

        .overlay-seal {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            animation: floatSeal 3s ease-in-out infinite;
        }

        @keyframes floatSeal {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .overlay h2 {
            font-family: 'MedievalSharp', cursive;
            font-size: clamp(1.1rem, 4vw, 1.8rem);
            color: #d4af37;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .overlay p {
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            color: #ede4c9;
            max-width: 380px;
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }

        .overlay-btn {
            background: #8b1e1e;
            color: #ede4c9;
            border: 2px solid #d4af37;
            padding: 0.6rem 1.5rem;
            font-family: 'MedievalSharp', cursive;
            font-size: clamp(0.75rem, 2.5vw, 0.9rem);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0.3rem;
        }

        .overlay-btn:hover, .overlay-btn:active {
            background: #d4af37;
            color: #1a0f0a;
        }

        .overlay-btn.gold {
            background: #d4af37;
            color: #1a0f0a;
            border-color: #f0d060;
        }

        .overlay-btn.gold:hover { background: #f0d060; }

        /* Banner notification */
        #banner {
            position: absolute;
            top: 12px; left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 8, 6, 0.9);
            border: 1.5px solid #d4af37;
            color: #d4af37;
            padding: 0.45rem 1.2rem;
            border-radius: 4px;
            font-size: 0.78rem;
            font-family: 'MedievalSharp', cursive;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 50;
            white-space: nowrap;
        }

        #banner.visible { opacity: 1; }

        /* CONTROLS WRAPPER */
        #controlsWrapper {
            flex: 0 0 auto;
            background: linear-gradient(0deg, #0f0a07 0%, #1a0f0a 100%);
            border-top: 2px solid #3d2010;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 1.2rem;
            gap: 0.5rem;
            user-select: none;
            -webkit-user-select: none;
        }

        /* D-pad */
        #dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0.2rem;
            width: clamp(120px, 28vw, 160px);
            height: clamp(120px, 28vw, 160px);
        }

        .dpad-btn {
            background: linear-gradient(145deg, #3d2010, #2a1508);
            border: 1.5px solid #8b5a2b;
            border-radius: 6px;
            color: #d4af37;
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            transition: background 0.1s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active, .dpad-btn.pressed {
            background: linear-gradient(145deg, #8b5a2b, #5c3a1a);
            transform: scale(0.92);
        }

        .dpad-center { background: #1a0f0a; border-color: transparent; pointer-events: none; }
        #dpad-up    { grid-column: 2; grid-row: 1; }
        #dpad-left  { grid-column: 1; grid-row: 2; }
        #dpad-center{ grid-column: 2; grid-row: 2; }
        #dpad-right { grid-column: 3; grid-row: 2; }
        #dpad-down  { grid-column: 2; grid-row: 3; }

        /* Action buttons */
        #actionButtons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .action-btn {
            border-radius: 50%;
            border: 2px solid #d4af37;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.1s;
        }

        #btnAction {
            width: clamp(52px, 13vw, 68px);
            height: clamp(52px, 13vw, 68px);
            background: linear-gradient(145deg, #8b1e1e, #5c0f0f);
            border-color: #d4af37;
        }

        #btnAction:active, #btnAction.pressed {
            background: linear-gradient(145deg, #d4af37, #c09020);
            transform: scale(0.9);
        }

        #btnSpecial {
            width: clamp(42px, 10vw, 54px);
            height: clamp(42px, 10vw, 54px);
            background: linear-gradient(145deg, #1a2a6c, #0f1a44);
            border-color: #7b8fff;
            display: none; /* hidden until Act V */
        }

        #btnSpecial:active, #btnSpecial.pressed {
            background: linear-gradient(145deg, #7b8fff, #5060cc);
            transform: scale(0.9);
        }

        #btnSpecial.visible { display: flex; }

        /* ===== HIDDEN ON DESKTOP (≥768px): show keyboard hint instead ===== */
        @media (min-width: 768px) {
            #controlsWrapper { display: none; }
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div id="hud">
        <div id="actIndicator">Act I</div>
        <div id="actTitle">The Ambition</div>
        <div id="hpBar">
            <span id="hpLabel">HP</span>
            <div id="hpBarInner"><div id="hpBarFill" style="width:100%"></div></div>
        </div>
        <div id="scoreDisplay">0</div>
    </div>

    <!-- Canvas -->
    <div id="canvasWrapper">
        <canvas id="gameCanvas"></canvas>

        <!-- Banner -->
        <div id="banner"></div>

        <!-- Overlay screens -->
        <div id="overlayStart" class="overlay">
            <div class="overlay-seal">⚔️</div>
            <h2>The Tragedy of<br>Macbeth</h2>
            <p>A tale of ambition, treachery, and downfall.<br>Five acts. One fate.</p>
            <button class="overlay-btn gold" id="btnStartGame">Begin Act I</button>
            <a href="index.html" style="margin-top:0.8rem; color:#8b5a2b; font-size:0.75rem;">← Return to Portal</a>
        </div>

        <div id="overlayActIntro" class="overlay hidden">
            <div class="overlay-seal" id="introSeal">🏰</div>
            <h2 id="introTitle">Act I</h2>
            <p id="introDesc">Collect all the crowns. Evade the guards. Do not fight — not yet.</p>
            <button class="overlay-btn gold" id="btnStartAct">Begin</button>
        </div>

        <div id="overlayGameOver" class="overlay hidden">
            <div class="overlay-seal">💀</div>
            <h2>"Blood will have blood..."</h2>
            <p id="gameOverScore">Final Score: 0</p>
            <button class="overlay-btn" id="btnRetry">Try Again</button>
            <button class="overlay-btn" id="btnReturnPortal">Return to Portal</button>
        </div>

        <div id="overlayVictory" class="overlay hidden">
            <div class="overlay-seal" id="victorySeal">👑</div>
            <h2 id="victoryTitle">Victory!</h2>
            <p id="victoryDesc">Proceed to the next act.</p>
            <button class="overlay-btn gold" id="btnNextAct">Continue →</button>
        </div>
    </div>

    <!-- Controls (Mobile) -->
    <div id="controlsWrapper">
        <div id="dpad">
            <button class="dpad-btn" id="dpad-up">▲</button>
            <button class="dpad-btn" id="dpad-left">◀</button>
            <div class="dpad-center" id="dpad-center"></div>
            <button class="dpad-btn" id="dpad-right">▶</button>
            <button class="dpad-btn" id="dpad-down">▼</button>
        </div>
        <div id="actionButtons">
            <button class="action-btn" id="btnSpecial">⚡</button>
            <button class="action-btn" id="btnAction">🗡️</button>
        </div>
    </div>

    <!-- Scripts: core first, then acts -->
    <script src="js/game.js"></script>
    <script src="js/acts/act1.js"></script>
    <script src="js/acts/act2.js"></script>
    <script src="js/acts/act3.js"></script>
    <script src="js/acts/act4.js"></script>
    <script src="js/acts/act5.js"></script>
</body>
</html>
