<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macbeth: Dagger's Labyrinth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-body">
    <header class="game-header">
        <a href="index.html" class="btn-back">← Return</a>
        <h1>Out, Damned Dagger!</h1>
        <div class="score-board">Score: <span id="scoreValue">0</span></div>
    </header>

    <main class="game-container">
        <div id="startScreen" class="overlay">
            <h2>Act I: The Ambition</h2>
            <button id="btnStart" class="btn">Draw Sword (Start)</button>
        </div>
        
        <div id="gameOverScreen" class="overlay hidden">
            <h2>"Blood will have blood..."</h2>
            <p id="finalScore"></p>
            <button id="btnRestart" class="btn">Try Again</button>
        </div>

        <div id="levelCompleteScreen" class="overlay hidden">
            <h2>Victory is yours...</h2>
            <button id="btnNextLevel" class="btn">Proceed to Act II</button>
        </div>

        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </main>

    <div id="mobileControls" class="mobile-controls">
        <button class="control-btn" id="btnUp">▲</button>
        <div class="middle-controls">
            <button class="control-btn" id="btnLeft">◀</button>
            <button class="control-btn" id="btnRight">▶</button>
        </div>
        <button class="control-btn" id="btnDown">▼</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
